# GitHub Actions template — copy to .github/workflows/backend-verify.yml in your monorepo root.
name: Backend verify

on:
  push:
    paths:
      - 'website-backend/website-*-service/**'
      - 'website-backend/website-api-gateway/**'
  pull_request:
    paths:
      - 'website-backend/website-*-service/**'
      - 'website-backend/website-api-gateway/**'

jobs:
  auth-service:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn verify (auth-service)
        working-directory: website-backend/website-auth-service
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: mvn -B verify

  api-gateway:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn verify (api-gateway)
        working-directory: website-backend/website-api-gateway
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: mvn -B verify
