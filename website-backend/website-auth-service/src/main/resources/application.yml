server:
  port: 8081
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${WEBSITE_DB_HOST:localhost}:${WEBSITE_DB_PORT:5432}/${WEBSITE_DB_NAME:website_db}?currentSchema=auth
    username: ${WEBSITE_DB_USER:postgres}
    password: ${WEBSITE_DB_PASSWORD:pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    schemas: auth
    default-schema: auth
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 10s
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
app:
  jwt:
    issuer: ${JWT_ISSUER:https://website.local/auth-service}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
    private-key-location: ${JWT_PRIVATE_KEY:classpath:jwt/private.pem}
    public-key-location: ${JWT_PUBLIC_KEY:classpath:jwt/public.pem}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    path: /api-docs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
