server:
  port: 8084
spring:
  application:
    name: media-service
  datasource:
    url: jdbc:postgresql://${WEBSITE_DB_HOST:localhost}:${WEBSITE_DB_PORT:5432}/${WEBSITE_DB_NAME:website_db}?currentSchema=media
    username: ${WEBSITE_DB_USER:postgres}
    password: ${WEBSITE_DB_PASSWORD:pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    schemas: media
    default-schema: media
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    path: /api-docs

website:
  media:
    upload-dir: ${WEBSITE_MEDIA_UPLOAD_DIR:data/uploads}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
