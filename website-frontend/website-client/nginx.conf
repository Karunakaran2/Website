server {
    listen 81;

    server_name design-system.kran.co.in localhost;

    root /usr/share/nginx/html;

    location ~ ^/kran-design-system(/.*)?$ {
        index index.html;
        try_files $uri $uri/ /kran-design-system/index.html;
    }

    location = /kran-design-system {
        index index.html;
        try_files /kran-design-system/index.html =404;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
